<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agents — ADE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="bootstrap-ade.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout" data-ade-nav="agents">
    <span id="ade-nav-inject"></span>
    <main class="main">
      <button type="button" class="nav-toggle btn btn-outline-secondary" id="nav-toggle" aria-label="Open menu">≡</button>
      <h1>Agents</h1>
      <p class="muted">Create and open agents. Set model, system prompt, and tools.</p>
      <div id="error"></div>
      <form id="create-form" class="card ade-panel border-secondary mb-4">
        <div class="card-body">
          <h2 class="h6 mb-3">Create agent</h2>
          <div class="mb-3">
            <label class="form-label" for="name">Name *</label>
            <input type="text" class="form-control" id="name" placeholder="Agent name" />
          </div>
          <div class="mb-3" id="model-row" style="display:none">
            <label class="form-label" for="model">Model</label>
            <select class="form-select" id="model"></select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="system">System prompt</label>
            <textarea class="form-control" id="system" placeholder="Instructions for the agent…" rows="4"></textarea>
          </div>
          <div class="mb-3" id="tools-row" style="display:none">
            <span class="form-label d-block">Tools</span>
            <div id="tools-checkboxes" class="small"></div>
          </div>
          <button type="submit" class="btn btn-primary" id="create-btn">Create agent</button>
        </div>
      </form>
      <ul id="list" class="list-unstyled p-0"></ul>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var listEl = document.getElementById('list');
    var errorEl = document.getElementById('error');
    var models = [], tools = [];
    function norm(d) { return Array.isArray(d) ? d : (d && d.data) ? d.data : (d && d.agents) ? d.agents : []; }
    function normList(d) { return Array.isArray(d) ? d : (d && d.data) ? d.data : []; }
    function id(a) { return a.id != null ? a.id : a.agent_id; }
    function name(a) { return a.name != null ? a.name : a.agent_name || id(a); }
    function modelId(m) { return m.handle != null ? m.handle : m.id || m.model || m.name; }
    function modelLabel(m) { return m.display_name != null ? m.display_name : m.handle || m.model || m.name || modelId(m); }
    function toolId(t) { return t.id != null ? t.id : t.tool_id || t.name; }
    function toolName(t) { return t.name != null ? t.name : t.tool_id || t.id; }
    function render(agents) {
      if (!agents.length) { listEl.innerHTML = '<li class="muted">No agents yet.</li>'; return; }
      listEl.innerHTML = agents.map(function(a) {
        var aid = id(a);
        return '<li class="ade-list-row mb-2"><a class="btn btn-outline-secondary flex-grow-1 text-start" href="agent.html?id=' + encodeURIComponent(aid) + '">' + name(a) + '</a><button type="button" class="btn btn-danger" data-id="' + encodeURIComponent(aid) + '">Delete</button></li>';
      }).join('');
      listEl.querySelectorAll('button[data-id]').forEach(function(btn) {
        btn.onclick = function() {
          if (!confirm('Delete this agent?')) return;
          var aid = btn.getAttribute('data-id');
          window.ADE.deleteAgent(aid).then(function() { return window.ADE.listAgents(); }).then(function(d) { render(norm(d)); return window.ADE.refreshAgentSelect(); }).catch(function(err) { errorEl.innerHTML = '<div class="alert alert-danger" role="alert">' + err.message + '</div>'; });
        };
      });
    }
    Promise.all([window.ADE.listAgents(), window.ADE.listModels().catch(function() { return []; }), window.ADE.listTools().catch(function() { return []; })]).then(function(arr) {
      var agentsData = arr[0], modelsData = arr[1], toolsData = arr[2];
      render(norm(agentsData));
      models = normList(modelsData);
      tools = normList(toolsData);
      if (models.length) {
        document.getElementById('model-row').style.display = 'block';
        document.getElementById('model').innerHTML = '<option value="">—</option>' + models.map(function(m) { return '<option value="' + modelId(m) + '">' + modelLabel(m) + '</option>'; }).join('');
      }
      if (tools.length) {
        document.getElementById('tools-row').style.display = 'block';
        document.getElementById('tools-checkboxes').innerHTML = tools.map(function(t) { return '<label class="form-check d-inline-block me-3 mb-2"><input class="form-check-input" type="checkbox" name="tool" value="' + toolId(t) + '"> <span class="form-check-label">' + toolName(t) + '</span></label>'; }).join('');
      }
    }).catch(function(e) { errorEl.innerHTML = '<div class="alert alert-danger" role="alert">' + e.message + '</div>'; });
    document.getElementById('create-form').onsubmit = function(e) {
      e.preventDefault();
      var n = document.getElementById('name').value.trim();
      if (!n) return;
      document.getElementById('create-btn').disabled = true;
      errorEl.innerHTML = '';
      var body = { name: n };
      var modelVal = document.getElementById('model').value;
      if (modelVal) body.model = modelVal;
      var systemVal = document.getElementById('system').value.trim();
      if (systemVal) body.system = systemVal;
      var checked = [].map.call(document.querySelectorAll('input[name=tool]:checked'), function(c) { return c.value; });
      if (checked.length) body.tool_ids = checked;
      var newIdFromCreate = null;
      window.ADE.createAgent(body).then(function(created) {
        newIdFromCreate = created && (created.id != null ? created.id : created.agent_id);
        document.getElementById('name').value = '';
        document.getElementById('model').value = '';
        document.getElementById('system').value = '';
        document.querySelectorAll('input[name=tool]').forEach(function(c) { c.checked = false; });
        return window.ADE.listAgents();
      }).then(function(d) {
        render(norm(d));
        return window.ADE.refreshAgentSelect({ preferId: newIdFromCreate != null ? String(newIdFromCreate) : null });
      }).catch(function(err) { errorEl.innerHTML = '<div class="alert alert-danger" role="alert">' + err.message + '</div>'; }).finally(function() { document.getElementById('create-btn').disabled = false; });
    };
  </script>
</body>
</html>
