<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — ADE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="bootstrap-ade.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout" data-ade-nav="settings">
    <span id="ade-nav-inject"></span>
    <main class="main">
      <button type="button" class="nav-toggle btn btn-outline-secondary" id="nav-toggle" aria-label="Open menu">≡</button>
      <h1>Settings</h1>
      <p class="muted">Base URL and API key are read from <code>config.js</code> (copy from config.example.js) or from this page (saved in this browser).</p>
      <form id="form" style="max-width:480px">
        <div class="mb-3">
          <label class="form-label" for="base">API base URL</label>
          <input type="text" class="form-control" id="base" autocomplete="url" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="key">API key (optional)</label>
          <input type="text" class="form-control" id="key" placeholder="Bearer token" autocomplete="off" />
        </div>
        <button type="submit" class="btn btn-primary">Save in this browser</button>
      </form>
      <p class="muted mt-4">Saved values override config.js for this browser only.</p>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var c = window.ADE.getConfig();
    document.getElementById('base').value = c.base;
    document.getElementById('key').value = c.key;
    document.getElementById('form').onsubmit = function(e) {
      e.preventDefault();
      window.ADE.setStoredBase(document.getElementById('base').value.trim());
      window.ADE.setStoredKey(document.getElementById('key').value.trim());
      window.ADE.fillApiBaseDisplay();
      alert('Saved. Reload any page to use the new values.');
    };
  </script>
</body>
</html>
