<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ADE (Local)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="bootstrap-ade.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout" data-ade-nav="dashboard">
    <span id="ade-nav-inject"></span>
    <main class="main">
      <button type="button" class="nav-toggle btn btn-outline-secondary" id="nav-toggle" aria-label="Open menu">≡</button>
      <h1>Dashboard</h1>
      <p class="muted">Local ADE — agents and chat.</p>
      <div id="status"></div>
      <div id="cards" class="list-group list-group-flush rounded border border-secondary" style="max-width: 42rem">
        <a href="agents.html" class="list-group-item list-group-item-action py-3">Agents — create, model &amp; LLM params, tools, memory blocks</a>
        <a href="tools.html" class="list-group-item list-group-item-action py-3">Tools — view and attach to agents</a>
        <a href="mcp.html" class="list-group-item list-group-item-action py-3">MCP — register servers (HTTP, SSE, stdio)</a>
        <a href="chat.html" class="list-group-item list-group-item-action py-3">Chat — talk to an agent</a>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var statusEl = document.getElementById('status');
    // Health endpoints are often auth-protected in local/proxied setups.
    // Use an authenticated API call as the connectivity check.
    window.ADE.listAgents().then(function() { return { ok: true }; }).catch(function() { return { ok: false }; })
      .then(function(h) {
        statusEl.innerHTML = '<div class="alert ' + (h.ok ? 'alert-success' : 'alert-danger') + ' mb-3" role="alert"><strong>API:</strong> ' + (h.ok ? 'Connected' : 'Unreachable') + '</div>';
      });
  </script>
</body>
</html>
