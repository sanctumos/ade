<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tools — ADE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="bootstrap-ade.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout" data-ade-nav="tools">
    <span id="ade-nav-inject"></span>
    <main class="main">
      <button type="button" class="nav-toggle btn btn-outline-secondary" id="nav-toggle" aria-label="Open menu">≡</button>
      <h1>Tools</h1>
      <p class="muted">All tools available to agents. Attach them when creating or editing an agent.</p>
      <div id="error"></div>
      <ul id="list" class="list-unstyled p-0"></ul>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var listEl = document.getElementById('list');
    var errorEl = document.getElementById('error');
    function norm(d) { return Array.isArray(d) ? d : (d && d.data) ? d.data : (d && d.tools) ? d.tools : []; }
    function tid(t) { return t.id != null ? t.id : t.tool_id || t.name; }
    function tname(t) { return t.name != null ? t.name : t.tool_id || t.id; }
    function ttype(t) { return t.tool_type != null ? t.tool_type : t.type || '—'; }
    window.ADE.listTools().then(function(d) {
      var tools = norm(d);
      listEl.innerHTML = tools.length ? tools.map(function(t) {
        return '<li class="mb-2 list-unstyled"><div class="card border-secondary"><div class="card-body py-3"><div class="fw-bold">' + tname(t) + '</div><div class="meta-text mt-1">ID: ' + tid(t) + ' · Type: ' + ttype(t) + '</div>' + (t.description ? '<div class="subtle-text mt-2">' + t.description + '</div>' : '') + '</div></div></li>';
      }).join('') : '<li class="muted">No tools yet. Add MCP servers or create server tools.</li>';
    }).catch(function(e) { errorEl.innerHTML = '<div class="alert alert-danger" role="alert">' + e.message + '</div>'; });
  </script>
</body>
</html>
