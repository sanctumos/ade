<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent — ADE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>ADE (Local)</h2>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="agents.html">Agents</a>
        <a href="chat.html">Chat</a>
        <a href="settings.html">Settings</a>
      </nav>
      <p class="api-badge">API: <span id="api-base-display">…</span></p>
    </aside>
    <main class="main">
      <p class="muted"><a href="agents.html">← Agents</a></p>
      <h1 id="title">…</h1>
      <div id="error"></div>
      <p><a href="#" id="chat-link" class="card" style="display:inline-block">Open in Chat →</a></p>
      <h2 style="font-size:16px">Memory (persona)</h2>
      <textarea id="memory" rows="6" style="width:100%;max-width:560px;margin-bottom:8px"></textarea>
      <button class="btn" id="save-memory">Save memory</button>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('api-base-display').textContent = window.ADE.apiBase();
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    if (!id) { document.getElementById('title').textContent = 'No agent'; return; }
    document.getElementById('chat-link').href = 'chat.html?agent=' + encodeURIComponent(id);
    window.ADE.getAgent(id).then(function(a) {
      document.getElementById('title').textContent = a.name || a.agent_name || id;
    }).catch(function(e) { document.getElementById('error').innerHTML = '<div class="error">' + e.message + '</div>'; });
    window.ADE.getAgentMemory(id).then(function(m) {
      var content = (m && m.content) || (m && m.block && m.block.content) || (typeof m === 'string' ? m : '');
      document.getElementById('memory').value = content;
    }).catch(function() {});
    document.getElementById('save-memory').onclick = function() {
      var content = document.getElementById('memory').value;
      document.getElementById('save-memory').disabled = true;
      window.ADE.updateAgentMemory(id, 'persona', { content: content }).then(function() { document.getElementById('save-memory').disabled = false; }).catch(function(e) { document.getElementById('error').innerHTML = '<div class="error">' + e.message + '</div>'; document.getElementById('save-memory').disabled = false; });
    };
  </script>
</body>
</html>
