<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Letta ADE (local)</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div class="af-layout" data-ade-nav="projects">
    <span id="ade-nav-inject"></span>
    <main class="af-main">
      <button type="button" class="af-nav-toggle" id="nav-toggle" aria-label="Open menu">≡</button>
      <h1>Project</h1>
      <div id="meta" class="af-muted"></div>
      <div id="error"></div>
      <p class="af-muted"><a href="projects.html">← Projects</a></p>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    var meta = document.getElementById('meta');
    var errorEl = document.getElementById('error');
    if (!id) {
      meta.textContent = 'Missing ?id=';
    } else {
      window.ADE.getProject(id).then(function(p) {
        meta.innerHTML = '<strong>' + (p.name || id) + '</strong> <span class="af-muted">(' + id + ')</span>';
      }).catch(function(e) {
        errorEl.innerHTML = '<div class="af-alert af-alert-danger">' + e.message + '</div>';
      });
    }
  </script>
</body>
</html>
