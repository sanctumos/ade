<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="skin-boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Sanctum ADE</title>
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="skins/skins.css" />
</head>
<body>
  <div class="af-layout" data-ade-nav="settings">
    <span id="ade-nav-inject"></span>
    <main class="af-main">
      <button type="button" class="af-nav-toggle" id="nav-toggle" aria-label="Open menu">≡</button>
      <h1>Settings</h1>
      <p class="af-muted">API connection and appearance for this browser.</p>

      <section class="af-panel" style="max-width:640px;margin-bottom:20px">
        <h2 style="margin:0 0 6px;font-size:16px">
          <span class="af-tip">
            <span class="af-tip-label">Appearance</span>
            <button type="button" class="af-tip-btn" aria-expanded="false" aria-controls="af-tip-settings-skin" aria-label="Explain: Appearance">?</button>
            <span id="af-tip-settings-skin" role="tooltip" class="af-tip-bubble" hidden>Same Sanctum skins as Tasks, CRM, and Docket. Your choice is saved in this browser and applies across ADE.</span>
          </span>
        </h2>
        <p class="af-muted af-small" style="margin:0 0 4px">Pick a skin for this browser.</p>
        <div class="af-skin-grid" id="skin-grid" role="radiogroup" aria-label="Skin"></div>
      </section>

      <form id="form" class="af-panel" style="max-width:480px">
        <h2 style="margin:0 0 12px;font-size:16px">API</h2>
        <label class="af-label" for="base">
          <span class="af-tip">
            <span class="af-tip-label">API base URL</span>
            <button type="button" class="af-tip-btn" aria-expanded="false" aria-controls="af-tip-settings-base" aria-label="Explain: API base URL">?</button>
            <span id="af-tip-settings-base" role="tooltip" class="af-tip-bubble" hidden>Root URL of your self-hosted agent API (or the ADE proxy). Example: https://ade.example.com/proxy.php — Letta-compatible /v1, not Letta Cloud.</span>
          </span>
        </label>
        <input type="text" class="af-input" id="base" autocomplete="url" style="margin-bottom:14px" />
        <label class="af-label" for="key">
          <span class="af-tip">
            <span class="af-tip-label">API key (optional)</span>
            <button type="button" class="af-tip-btn" aria-expanded="false" aria-controls="af-tip-settings-key" aria-label="Explain: API key">?</button>
            <span id="af-tip-settings-key" role="tooltip" class="af-tip-bubble" hidden>Bearer token if your Letta server requires one. Stored only in this browser’s localStorage — never sent to us.</span>
          </span>
        </label>
        <input type="text" class="af-input" id="key" placeholder="Bearer token" autocomplete="off" style="margin-bottom:16px" />
        <button type="submit" class="af-btn af-btn-primary">Save in this browser</button>
      </form>
      <p class="af-muted af-small">Saved values override config.js for this browser only.</p>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="tip.js"></script>
  <script src="app.js"></script>
  <script>
    var c = window.ADE.getConfig();
    document.getElementById('base').value = c.base;
    document.getElementById('key').value = c.key;
    document.getElementById('form').onsubmit = function(e) {
      e.preventDefault();
      window.ADE.setStoredBase(document.getElementById('base').value.trim());
      window.ADE.setStoredKey(document.getElementById('key').value.trim());
      window.ADE.fillApiBaseDisplay();
      alert('Saved. Reload any page to use the new values.');
    };

    var blurbs = {
      hey: 'Light, high-contrast, electric blue — Sanctum default.',
      ledger: 'Cream paper and ink — softer on the eyes.',
      brutalist: 'Concrete gray, bold borders, zero radius.',
      obsidian: 'Dark OLED with cream type and gold accent.'
    };
    var grid = document.getElementById('skin-grid');
    var current = window.ADE.getSkin();
    window.ADE.SKIN_SLUGS.forEach(function(slug) {
      var card = document.createElement('label');
      card.className = 'af-skin-card' + (slug === current ? ' is-active' : '');
      card.setAttribute('data-slug', slug);
      card.innerHTML =
        '<input type="radio" name="skin" value="' + slug + '"' + (slug === current ? ' checked' : '') + ' />' +
        '<div class="af-skin-swatch" aria-hidden="true"></div>' +
        '<strong>' + window.ADE.SKIN_LABELS[slug] + '</strong>' +
        '<span>' + blurbs[slug] + '</span>';
      card.addEventListener('click', function(ev) {
        ev.preventDefault();
        window.ADE.setSkin(slug);
      });
      grid.appendChild(card);
    });
  </script>
</body>
</html>
