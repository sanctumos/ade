<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agents — Letta ADE</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div class="af-layout" data-ade-nav="agents">
    <span id="ade-nav-inject"></span>
    <main class="af-main">
      <div class="af-page-head">
        <div class="af-page-head-main">
          <button type="button" class="af-nav-toggle" id="nav-toggle" aria-label="Open menu">≡</button>
          <div>
            <h1>Agents</h1>
            <p class="af-lede" id="agents-count">Every agent on your Letta server.</p>
          </div>
        </div>
        <button type="button" class="af-btn af-btn-primary" id="new-agent-btn"><span data-af-icon="plus"></span>New agent</button>
      </div>
      <div id="error"></div>
      <details class="af-panel" id="create-panel">
        <summary><h2>Create agent</h2><span class="af-summary-chev" data-af-icon="chevron"></span></summary>
      <form id="create-form" style="max-width:42rem">
        <div class="af-field">
          <label class="af-label" for="name">Name *</label>
          <input type="text" class="af-input" id="name" placeholder="Agent name" />
        </div>
        <div class="af-field af-hidden" id="model-row">
          <label class="af-label" for="model">Model</label>
          <select class="af-select" id="model"></select>
        </div>
        <div class="af-field">
          <label class="af-label" for="system">System prompt</label>
          <textarea class="af-input af-input-wide" id="system" placeholder="Instructions for the agent…" rows="4"></textarea>
        </div>
        <div class="af-field af-hidden" id="tools-row">
          <span class="af-label">Tools</span>
          <div id="tools-checkboxes" class="af-stack-sm"></div>
        </div>
        <button type="submit" class="af-btn af-btn-primary" id="create-btn">Create agent</button>
      </form>
      </details>
      <ul id="list" class="af-agent-grid"></ul>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var listEl = document.getElementById('list');
    var errorEl = document.getElementById('error');
    var models = [], tools = [];
    function norm(d) { return Array.isArray(d) ? d : (d && d.data) ? d.data : (d && d.agents) ? d.agents : []; }
    function normList(d) { return Array.isArray(d) ? d : (d && d.data) ? d.data : []; }
    function id(a) { return a.id != null ? a.id : a.agent_id; }
    function name(a) { return a.name != null ? a.name : a.agent_name || id(a); }
    function modelId(m) { return m.handle != null ? m.handle : m.id || m.model || m.name; }
    function modelLabel(m) { return m.display_name != null ? m.display_name : m.handle || m.model || m.name || modelId(m); }
    function toolId(t) { return t.id != null ? t.id : t.tool_id || t.name; }
    function toolName(t) { return t.name != null ? t.name : t.tool_id || t.id; }
    function showErr(msg) { errorEl.innerHTML = '<div class="af-alert af-alert-danger" role="alert">' + msg + '</div>'; }
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    var I = window.ADE.icons;
    document.getElementById('new-agent-btn').onclick = function() {
      var p = document.getElementById('create-panel');
      p.open = true;
      p.scrollIntoView({ behavior: 'smooth', block: 'start' });
      document.getElementById('name').focus();
    };
    function render(agents) {
      document.getElementById('agents-count').textContent = agents.length
        ? agents.length + (agents.length === 1 ? ' agent' : ' agents') + ' on your Letta server.'
        : 'No agents on this server yet.';
      if (!agents.length) {
        listEl.innerHTML = '<li class="af-empty" style="grid-column:1/-1">No agents yet. Use <strong>New agent</strong> to create one.</li>';
        document.getElementById('create-panel').open = true;
        return;
      }
      agents = agents.slice().sort(function(x, y) { return String(name(x)).localeCompare(String(name(y))); });
      listEl.innerHTML = agents.map(function(a) {
        var aid = id(a), nm = name(a), model = window.ADE.agentModelLabel(a);
        var href = 'agent.html?id=' + encodeURIComponent(aid);
        return '<li class="af-agent-card">' +
          '<div class="af-agent-card-head">' + window.ADE.avatarHtml(nm) +
          '<div style="min-width:0"><a class="af-agent-card-name" href="' + href + '">' + esc(nm) + '</a>' +
          '<span class="af-agent-card-meta" title="' + esc(aid) + '">' + esc(model || aid) + '</span></div></div>' +
          '<div class="af-agent-card-actions">' +
          '<a class="af-btn af-btn-secondary af-btn-sm" href="' + href + '">' + I.sliders + 'Configure</a>' +
          '<a class="af-btn af-btn-secondary af-btn-sm" href="chat.html?agent=' + encodeURIComponent(aid) + '">' + I.chat + 'Chat</a>' +
          '<button type="button" class="af-btn af-btn-danger af-btn-sm af-btn-icon" title="Delete agent" aria-label="Delete ' + esc(nm) + '" data-id="' + encodeURIComponent(aid) + '">' + I.trash + '</button>' +
          '</div></li>';
      }).join('');
      listEl.querySelectorAll('button[data-id]').forEach(function(btn) {
        btn.onclick = function() {
          if (!confirm('Delete this agent?')) return;
          var aid = btn.getAttribute('data-id');
          window.ADE.deleteAgent(aid).then(function() { return window.ADE.listAgents(); }).then(function(d) { render(norm(d)); return window.ADE.refreshAgentSelect(); }).catch(function(err) { showErr(err.message); });
        };
      });
    }
    Promise.all([window.ADE.listAgents(), window.ADE.listModels().catch(function() { return []; }), window.ADE.listTools().catch(function() { return []; })]).then(function(arr) {
      render(norm(arr[0]));
      models = normList(arr[1]);
      tools = normList(arr[2]);
      if (models.length) {
        document.getElementById('model-row').classList.remove('af-hidden');
        document.getElementById('model').innerHTML = '<option value="">—</option>' + models.map(function(m) { return '<option value="' + modelId(m) + '">' + modelLabel(m) + '</option>'; }).join('');
      }
      if (tools.length) {
        document.getElementById('tools-row').classList.remove('af-hidden');
        document.getElementById('tools-checkboxes').innerHTML = tools.map(function(t) {
          return '<label class="af-check"><input type="checkbox" name="tool" value="' + toolId(t) + '"> ' + toolName(t) + '</label>';
        }).join('');
      }
    }).catch(function(e) { showErr(e.message); });
    document.getElementById('create-form').onsubmit = function(e) {
      e.preventDefault();
      var n = document.getElementById('name').value.trim();
      if (!n) return;
      document.getElementById('create-btn').disabled = true;
      errorEl.innerHTML = '';
      var body = { name: n };
      var modelVal = document.getElementById('model').value;
      if (modelVal) body.model = modelVal;
      var systemVal = document.getElementById('system').value.trim();
      if (systemVal) body.system = systemVal;
      var checked = [].map.call(document.querySelectorAll('input[name=tool]:checked'), function(c) { return c.value; });
      if (checked.length) body.tool_ids = checked;
      var newIdFromCreate = null;
      window.ADE.createAgent(body).then(function(created) {
        newIdFromCreate = created && (created.id != null ? created.id : created.agent_id);
        document.getElementById('name').value = '';
        document.getElementById('model').value = '';
        document.getElementById('system').value = '';
        document.querySelectorAll('input[name=tool]').forEach(function(c) { c.checked = false; });
        return window.ADE.listAgents();
      }).then(function(d) {
        render(norm(d));
        return window.ADE.refreshAgentSelect({ preferId: newIdFromCreate != null ? String(newIdFromCreate) : null });
      }).catch(function(err) { showErr(err.message); }).finally(function() { document.getElementById('create-btn').disabled = false; });
    };
  </script>
</body>
</html>
