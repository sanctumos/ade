<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat — Letta ADE</title>
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>
  <div class="af-layout" data-ade-nav="chat">
    <span id="ade-nav-inject"></span>
    <main class="af-main af-main--chat">
      <header class="chat-header">
        <div class="chat-header-main">
          <button type="button" class="af-nav-toggle" id="nav-toggle" aria-label="Open menu">≡</button>
          <span id="chat-agent-avatar"></span>
          <div class="chat-header-title">
            <h1 class="chat-header-name" id="chat-agent-name">Chat</h1>
            <div class="chat-header-sub" id="chat-agent-sub">Select an agent in the sidebar</div>
          </div>
        </div>
        <div class="chat-header-actions">
          <a href="agent.html" id="config-agent-link" class="af-btn af-btn-secondary af-btn-sm" title="Model, tools, core memory, archival"><span id="config-agent-icon"></span><span>Configure</span></a>
        </div>
      </header>
      <div class="chat-body">
        <div id="error"></div>
        <div class="chat-messages-scroll" id="chat-scroll">
          <div id="messages" class="chat-thread"></div>
        </div>
        <div class="chat-composer-wrap">
          <form id="send-form" class="chat-composer">
            <textarea id="input" rows="1" placeholder="Message the agent…" autocomplete="off" aria-label="Message"></textarea>
            <button type="submit" class="af-btn af-btn-primary chat-send" id="send-btn" aria-label="Send"></button>
          </form>
          <div class="chat-composer-meta">
            <p id="history-hint"></p>
            <span class="chat-kbd-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="chat-markdown.js"></script>
  <script>
    var AC = window.ADE_CHAT;
    var messagesEl = document.getElementById('messages');
    var inputEl = document.getElementById('input');
    var errorEl = document.getElementById('error');
    var scrollEl = document.getElementById('chat-scroll');
    function currentAgentId() { return window.ADE.getSelectedAgentId(); }
    var historyHint = document.getElementById('history-hint');
    var knownAgents = [];
    document.getElementById('send-btn').innerHTML = window.ADE.icons.send;
    document.getElementById('config-agent-icon').outerHTML = window.ADE.icons.sliders;

    function scrollToBottom() { scrollEl.scrollTop = scrollEl.scrollHeight; }

    function currentAgent() {
      var aid = currentAgentId();
      for (var i = 0; i < knownAgents.length; i++) {
        var a = knownAgents[i];
        if (String(a.id != null ? a.id : a.agent_id) === String(aid)) return a;
      }
      return null;
    }
    function currentAgentName() {
      var a = currentAgent();
      if (a) return a.name || a.agent_name || a.id;
      var sel = document.getElementById('ade-agent-select');
      return sel && sel.selectedIndex >= 0 && sel.value ? sel.options[sel.selectedIndex].text : 'Agent';
    }

    function updateHeader() {
      var aid = currentAgentId();
      var nameEl = document.getElementById('chat-agent-name');
      var subEl = document.getElementById('chat-agent-sub');
      var avEl = document.getElementById('chat-agent-avatar');
      if (!aid) {
        nameEl.textContent = 'Chat';
        subEl.textContent = 'Select an agent in the sidebar';
        avEl.innerHTML = '';
        return;
      }
      var nm = currentAgentName();
      nameEl.textContent = nm;
      avEl.innerHTML = window.ADE.avatarHtml(nm);
      var model = window.ADE.agentModelLabel(currentAgent());
      subEl.innerHTML = '<span class="af-dot is-ok"></span>' + AC.escHtml(model || 'Self-hosted Letta agent');
      document.title = nm + ' — Chat — Letta ADE';
    }

    function assistantRow(innerHtml) {
      var row = document.createElement('div');
      row.className = 'chat-row chat-row--assistant';
      var nm = currentAgentName();
      row.innerHTML = window.ADE.avatarHtml(nm) +
        '<div class="chat-row-body"><div class="chat-row-name">' + AC.escHtml(nm) + '</div>' +
        '<div class="chat-turn chat-turn--assistant">' + innerHtml + '</div></div>';
      return row;
    }
    function userRow(innerHtml) {
      var row = document.createElement('div');
      row.className = 'chat-row chat-row--user';
      row.innerHTML = '<div class="chat-row-body"><div class="chat-turn chat-turn--user">' + innerHtml + '</div></div>';
      return row;
    }

    /** Sleeptime / system-reminder payloads arrive as user_message; they are agent plumbing, not something a person typed. */
    var INTERNAL_PREVIEW_MAX = 20000;
    function isInternalContext(text) {
      var t = String(text || '').replace(/^\s+/, '');
      return t.indexOf('<system-reminder>') === 0 || t.indexOf('<system>') === 0 || t.length > 6000;
    }
    function internalContextElement(text) {
      var wrap = document.createElement('div');
      wrap.className = 'chat-turn chat-turn--internal chat-step';
      var s = String(text);
      var shown = s.length > INTERNAL_PREVIEW_MAX ? s.slice(0, INTERNAL_PREVIEW_MAX) + '\n…' : s;
      var tag = '<span class="chat-turn__label-tag">' + s.length.toLocaleString() + ' chars</span>';
      wrap.innerHTML = '<details class="chat-details">' +
        chatCollapsibleSummary('Internal context', tag) +
        '<div class="chat-details-body"><pre class="chat-json">' + AC.escHtml(shown) + '</pre></div></details>';
      return wrap;
    }

    function normalizeMessages(d) {
      if (Array.isArray(d)) return d;
      if (d && Array.isArray(d.messages)) return d.messages;
      if (d && Array.isArray(d.data)) return d.data;
      return [];
    }

    function messageTypeOf(m) {
      return String(m.message_type || m.type || '').toLowerCase();
    }

    function contentPartsToText(parts) {
      if (!Array.isArray(parts)) return '';
      return parts.map(function(p) {
        if (typeof p === 'string') return p;
        if (p && typeof p.text === 'string') return p.text;
        if (p && typeof p.content === 'string') return p.content;
        return '';
      }).join(' ').trim();
    }

    /** Letta: skip internal user events (login, system_alert JSON). */
    function isInternalUserMessage(m) {
      if (messageTypeOf(m) !== 'user_message') return false;
      var c = m.content;
      if (typeof c !== 'string') return false;
      try {
        var p = JSON.parse(c);
        return p && (p.type === 'login' || p.type === 'system_alert');
      } catch (e) { return false; }
    }

    function userFacingContent(m) {
      var c = m.content;
      if (typeof c === 'string') {
        try {
          var p = JSON.parse(c);
          if (p && p.type === 'user_message' && typeof p.message === 'string') return p.message;
        } catch (e) {}
        return c;
      }
      if (Array.isArray(c)) return contentPartsToText(c);
      return '';
    }

    function assistantFacingContent(m) {
      if (typeof m.content === 'string') return m.content;
      if (Array.isArray(m.content)) return contentPartsToText(m.content);
      return '';
    }

    function legacyFlatContent(m) {
      if (!m) return '';
      if (typeof m.content === 'string' && m.content) return m.content;
      if (Array.isArray(m.content)) {
        var t = contentPartsToText(m.content);
        if (t) return t;
      }
      if (m.reasoning) return String(m.reasoning);
      if (m.tool_call) {
        var tc = m.tool_call;
        return (tc.name || 'tool') + (tc.arguments ? '\n' + tc.arguments : '');
      }
      if (Array.isArray(m.tool_calls) && m.tool_calls.length) {
        return m.tool_calls.map(function(tc) { return (tc && tc.name) || 'call'; }).join(', ');
      }
      if (m.tool_return != null) return String(m.tool_return);
      return '';
    }

    function collectToolCalls(m) {
      var all = [];
      if (m.tool_call) all.push(m.tool_call);
      if (Array.isArray(m.tool_calls)) all = all.concat(m.tool_calls);
      var seen = {};
      return all.filter(function(tc) {
        if (!tc) return false;
        var k = tc.tool_call_id || tc.id || ((tc.name || '') + '|' + (tc.arguments || ''));
        if (seen[k]) return false;
        seen[k] = true;
        return true;
      });
    }

    function toolReturnBodyHtml(val) {
      if (val == null || val === '') return '<p class="af-muted" style="margin:0">(empty)</p>';
      if (typeof val === 'object') {
        try {
          return '<pre class="chat-json">' + AC.escHtml(JSON.stringify(val, null, 2)) + '</pre>';
        } catch (e) {
          return '<pre class="chat-json">' + AC.escHtml(String(val)) + '</pre>';
        }
      }
      var s = String(val);
      if (!s.trim()) return '<p class="af-muted" style="margin:0">(empty)</p>';
      try {
        JSON.parse(s);
        return '<pre class="chat-json">' + AC.formatJsonMaybe(s) + '</pre>';
      } catch (e) {
        return '<div class="chat-md">' + AC.parseMarkdown(s) + '</div>';
      }
    }

    function shortToolCallId(id) {
      if (id == null || id === '') return '';
      var s = String(id);
      return s.length > 14 ? s.slice(0, 10) + '…' : s;
    }

    /** Opens a <details> block; tagsHtml is pre-built badge HTML (escaped). */
    function chatCollapsibleSummary(titleText, tagsHtml) {
      return '<summary class="chat-collapsible-summary">' +
        '<div class="chat-summary-row">' +
        '<span class="chat-summary-chevron" aria-hidden="true"></span>' +
        '<span class="chat-summary-title">' + AC.escHtml(titleText) + '</span>' + (tagsHtml || '') +
        '</div></summary>';
    }

    function toolCallSummaryTags(calls) {
      var names = calls.map(function(tc) { return (tc && tc.name) || 'tool'; });
      if (!names.length) return '';
      if (names.length <= 3) {
        return names.map(function(nm) {
          return '<span class="chat-turn__label-tag">' + AC.escHtml(nm) + '</span>';
        }).join('');
      }
      return '<span class="chat-turn__label-tag">' + AC.escHtml(names[0]) + '</span>' +
        '<span class="chat-turn__label-tag">+' + (names.length - 1) + ' more</span>';
    }

    /**
     * One DOM node per API message — matches Letta message_type lanes.
     */
    function createMessageElement(m) {
      var mt = messageTypeOf(m);
      if (!mt) {
        var r = String(m.role || '').toLowerCase();
        if (r === 'user') mt = 'user_message';
        else if (r === 'system') mt = 'system_message';
        else mt = 'assistant_message';
      }

      var wrap = document.createElement('div');

      if (mt === 'reasoning_message') {
        wrap.className = 'chat-turn chat-turn--reasoning chat-step';
        var src = m.source ? String(m.source).replace(/_/g, ' ') : '';
        var reasoning = m.reasoning != null ? String(m.reasoning) : '';
        var srcTag = src ? '<span class="chat-turn__label-tag">' + AC.escHtml(src) + '</span>' : '';
        wrap.innerHTML =
          '<details class="chat-details">' +
          chatCollapsibleSummary('Reasoning', srcTag) +
          '<div class="chat-details-body"><div class="chat-md chat-reasoning-body">' + AC.parseMarkdown(reasoning) + '</div></div>' +
          '</details>';
        return wrap;
      }

      if (mt === 'hidden_reasoning_message') {
        wrap.className = 'chat-turn chat-turn--hidden-reasoning chat-step';
        var state = m.state ? String(m.state) : 'omitted';
        var stateTag = '<span class="chat-turn__label-tag">' + AC.escHtml(state) + '</span>';
        var inner;
        if (m.hidden_reasoning) {
          inner = '<div class="chat-md">' + AC.parseMarkdown(String(m.hidden_reasoning)) + '</div>';
        } else {
          inner = '<p class="af-muted" style="margin:0">Reasoning not shown (<code>' + AC.escHtml(state) + '</code>).</p>';
        }
        wrap.innerHTML =
          '<details class="chat-details">' +
          chatCollapsibleSummary('Hidden reasoning', stateTag) +
          '<div class="chat-details-body">' + inner + '</div></details>';
        return wrap;
      }

      if (mt === 'tool_call_message') {
        wrap.className = 'chat-turn chat-turn--tool-call chat-step';
        var callsTc = collectToolCalls(m);
        if (!callsTc.length) {
          wrap.innerHTML = '<div class="chat-turn__label">Tool call</div><p class="af-muted">(no tool_call payload)</p>';
          return wrap;
        }
        var bodyTc = callsTc.map(function(tc) {
          var nm = (tc && tc.name) || 'tool';
          var args = (tc && tc.arguments) != null ? tc.arguments : '';
          var tid = (tc && tc.tool_call_id) ? String(tc.tool_call_id) : '';
          return '<div class="chat-tool-meta"><strong>' + AC.escHtml(nm) + '</strong>' +
            (tid ? ' · <code>' + AC.escHtml(tid) + '</code>' : '') +
            '</div><pre class="chat-json">' + AC.formatJsonMaybe(args) + '</pre>';
        }).join('');
        wrap.innerHTML =
          '<details class="chat-details">' +
          chatCollapsibleSummary('Tool call', toolCallSummaryTags(callsTc)) +
          '<div class="chat-details-body">' + bodyTc + '</div></details>';
        return wrap;
      }

      if (mt === 'approval_request_message') {
        wrap.className = 'chat-turn chat-turn--approval chat-step';
        var callsAp = collectToolCalls(m);
        if (!callsAp.length) {
          wrap.innerHTML = '<div class="chat-turn__label">Approval required</div><p class="af-muted">(no tool_call payload)</p>';
          return wrap;
        }
        var bodyAp = callsAp.map(function(tc) {
          var nm = (tc && tc.name) || 'tool';
          var args = (tc && tc.arguments) != null ? tc.arguments : '';
          var tid = (tc && tc.tool_call_id) ? String(tc.tool_call_id) : '';
          return '<div class="chat-tool-meta"><strong>' + AC.escHtml(nm) + '</strong>' +
            (tid ? ' · <code>' + AC.escHtml(tid) + '</code>' : '') +
            '</div><pre class="chat-json">' + AC.formatJsonMaybe(args) + '</pre>';
        }).join('');
        wrap.innerHTML =
          '<details class="chat-details">' +
          chatCollapsibleSummary('Approval required', toolCallSummaryTags(callsAp)) +
          '<div class="chat-details-body">' + bodyAp + '</div></details>';
        return wrap;
      }

      if (mt === 'tool_return_message') {
        var err = String(m.status || '').toLowerCase() === 'error';
        wrap.className = 'chat-turn chat-turn--tool-return chat-step' + (err ? ' chat-turn--error' : '');
        var tid = m.tool_call_id ? String(m.tool_call_id) : '';
        var st = m.status ? String(m.status) : '—';
        var tidShort = tid ? shortToolCallId(tid) : '';
        var tagsTr = '';
        if (tidShort) {
          tagsTr += '<span class="chat-turn__label-tag" title="' + AC.escHtml(tid) + '">' + AC.escHtml(tidShort) + '</span>';
        }
        tagsTr += '<span class="chat-turn__label-tag">' + AC.escHtml(st) + '</span>';
        var body = toolReturnBodyHtml(m.tool_return);
        var extra = '';
        if (Array.isArray(m.stdout) && m.stdout.length) {
          extra += '<div class="chat-tool-meta" style="margin-top:10px">stdout</div><pre class="chat-json">' + AC.escHtml(m.stdout.join('\n')) + '</pre>';
        }
        if (Array.isArray(m.stderr) && m.stderr.length) {
          extra += '<div class="chat-tool-meta" style="margin-top:10px">stderr</div><pre class="chat-json">' + AC.escHtml(m.stderr.join('\n')) + '</pre>';
        }
        wrap.innerHTML =
          '<details class="chat-details">' +
          chatCollapsibleSummary('Tool result', tagsTr) +
          '<div class="chat-details-body">' + body + extra + '</div></details>';
        return wrap;
      }

      if (mt === 'approval_response_message') {
        wrap.className = 'chat-turn chat-turn--approval chat-step';
        var ok = m.approve === true;
        var reason = m.reason ? '<div class="chat-md" style="margin-top:8px">' + AC.parseMarkdown(String(m.reason)) + '</div>' : '';
        wrap.innerHTML =
          '<div class="chat-turn__label">Approval response</div>' +
          '<p style="margin:0;font-weight:600;color:' + (ok ? '#6ee7b7' : '#f87171') + '">' +
          (ok ? 'Approved' : 'Denied') + '</p>' + reason;
        return wrap;
      }

      if (mt === 'user_message') {
        var ut = userFacingContent(m);
        if (isInternalContext(ut)) return internalContextElement(ut);
        return userRow('<div class="chat-md">' + AC.parseMarkdown(ut) + '</div>');
      }

      if (mt === 'assistant_message') {
        var at = assistantFacingContent(m);
        if (!at.trim()) return null;
        return assistantRow('<div class="chat-md">' + AC.parseMarkdown(at) + '</div>');
      }

      if (mt === 'system_message') {
        var sc = typeof m.content === 'string' ? m.content : '';
        if (!sc.trim()) return null;
        return internalContextElement(sc);
      }

      /* Unknown type: best-effort single block */
      var flat = legacyFlatContent(m);
      if (!flat.trim()) return null;
      wrap.className = 'chat-turn chat-turn--system chat-step';
      wrap.innerHTML =
        '<div class="chat-turn__label">' + AC.escHtml(mt.replace(/_/g, ' ')) + '</div><div class="chat-md">' + AC.parseMarkdown(flat) + '</div>';
      return wrap;
    }

    function renderHistory(msgs) {
      messagesEl.innerHTML = '';
      var shown = 0;
      msgs.forEach(function(m) {
        if (isInternalUserMessage(m)) return;
        var el = createMessageElement(m);
        if (el) { messagesEl.appendChild(el); shown++; }
      });
      if (!shown) {
        renderEmpty('No messages yet', 'Say hello below to start the conversation.');
        return;
      }
      scrollToBottom();
    }

    function renderEmpty(title, text) {
      var aid = currentAgentId();
      messagesEl.innerHTML = '<div class="chat-empty">' +
        (aid ? window.ADE.avatarHtml(currentAgentName(), 'lg') : '') +
        '<h2>' + AC.escHtml(title) + '</h2><p>' + AC.escHtml(text) + '</p></div>';
    }

    function loadHistory(aid, opts) {
      opts = opts || {};
      if (!aid) {
        renderEmpty('No agent selected', 'Pick an agent from the sidebar to start chatting.');
        return Promise.resolve(false);
      }
      historyHint.textContent = 'Loading conversation…';
      return window.ADE.getAgentMessages(aid, { limit: '200' }).then(function(d) {
        var msgs = normalizeMessages(d);
        historyHint.textContent = msgs.length ? ('Showing last ' + msgs.length + ' messages') : '';
        renderHistory(msgs);
        return true;
      }).catch(function() {
        historyHint.textContent = 'Could not load history — new messages still work.';
        if (!opts.softFail) renderEmpty('History not available', 'Send a message to start.');
        return false;
      });
    }

    function onAgentContext(ev) {
      var id = ev && ev.detail && ev.detail.id != null ? ev.detail.id : currentAgentId();
      if (ev && ev.detail && Array.isArray(ev.detail.agents)) knownAgents = ev.detail.agents;
      updateHeader();
      errorEl.innerHTML = '';
      if (ev && ev.detail && ev.detail.error) {
        errorEl.innerHTML = '<div class="af-alert af-alert-danger" role="alert">Could not load agents for the sidebar.</div>';
        return;
      }
      loadHistory(id);
    }
    document.addEventListener('ade-agentselectready', onAgentContext);
    document.addEventListener('ade-agentchange', onAgentContext);

    function updateAgentSetupLink() {
      var link = document.getElementById('config-agent-link');
      if (!link) return;
      var aid = window.ADE.getSelectedAgentId();
      link.href = aid ? ('agent.html?id=' + encodeURIComponent(aid)) : 'agent.html';
    }
    updateAgentSetupLink();
    document.addEventListener('ade-agentchange', updateAgentSetupLink);
    document.addEventListener('ade-agentselectready', updateAgentSetupLink);

    function addMsg(role, content) {
      var empty = messagesEl.querySelector('.chat-empty');
      if (empty) empty.remove();
      var el = role === 'user'
        ? userRow('<div class="chat-md">' + AC.parseMarkdown(content) + '</div>')
        : assistantRow('<div class="chat-md">' + AC.parseMarkdown(content) + '</div>');
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    function autoGrow() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
    }
    inputEl.addEventListener('input', autoGrow);
    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        document.getElementById('send-form').requestSubmit();
      }
    });

    function extractAssistant(res) {
      if (!res) return '';
      if (typeof res === 'string') return res;
      if (res.message) return res.message;
      if (res.content) return res.content;
      if (res.response) return res.response;
      var msgs = Array.isArray(res.messages) ? res.messages : [];
      for (var i = msgs.length - 1; i >= 0; i--) {
        var m = msgs[i] || {};
        var mt = String(m.message_type || m.type || '').toLowerCase();
        var r = String(m.role || '').toLowerCase();
        if (mt !== 'assistant_message' && r !== 'assistant') continue;
        if (typeof m.content === 'string') return m.content;
        if (Array.isArray(m.content)) {
          var txt = m.content.map(function(p) {
            if (typeof p === 'string') return p;
            if (p && typeof p.text === 'string') return p.text;
            if (p && typeof p.content === 'string') return p.content;
            return '';
          }).join(' ').trim();
          if (txt) return txt;
        }
      }
      return '';
    }

    function streamContentFromEvent(obj) {
      if (!obj || typeof obj !== 'object') return '';
      if (obj.message_type === '_json_response') return extractAssistant(obj.data) || '';
      var mt = String(obj.message_type || obj.type || '').toLowerCase();
      if (mt === 'assistant_message' || mt === 'assistant') {
        if (typeof obj.content === 'string') return obj.content;
        if (Array.isArray(obj.content)) {
          return obj.content.map(function(p) {
            if (typeof p === 'string') return p;
            if (p && typeof p.text === 'string') return p.text;
            return '';
          }).join('');
        }
      }
      if (typeof obj.content === 'string' && (obj.role === 'assistant' || mt.indexOf('assistant') !== -1)) return obj.content;
      if (obj.delta && typeof obj.delta.content === 'string') return obj.delta.content;
      if (typeof obj.token === 'string') return obj.token;
      if (typeof obj.text === 'string' && mt.indexOf('assistant') !== -1) return obj.text;
      return '';
    }

    document.getElementById('send-form').onsubmit = function(e) {
      e.preventDefault();
      var text = inputEl.value.trim();
      var aid = currentAgentId();
      if (!text || !aid) return;
      inputEl.value = '';
      autoGrow();
      addMsg('user', text);
      document.getElementById('send-btn').disabled = true;
      errorEl.innerHTML = '';

      var streamWrap = assistantRow('<div class="chat-md" data-stream-body><span class="chat-typing" aria-label="Agent is thinking"><i></i><i></i><i></i></span></div>');
      messagesEl.appendChild(streamWrap);
      scrollToBottom();
      var bodyEl = streamWrap.querySelector('[data-stream-body]');
      var acc = '';
      var sawAssistant = false;

      window.ADE.sendMessagePreferStream(aid, { input: text }, {
        onEvent: function(obj) {
          if (!obj) return;
          if (obj.message_type === '_json_response') {
            var fb = extractAssistant(obj.data);
            if (fb) { acc = fb; sawAssistant = true; bodyEl.innerHTML = AC.parseMarkdown(acc); }
            return;
          }
          var mt = String(obj.message_type || obj.type || '').toLowerCase();
          /* Live-render non-assistant lanes from stream when complete step objects arrive */
          if (mt && mt !== 'assistant_message' && mt !== 'assistant' && mt !== '_raw' && !obj.delta && !obj.token) {
            if (mt === 'ping' || mt === 'keepalive') return;
            var el = createMessageElement(obj);
            if (el) {
              messagesEl.insertBefore(el, streamWrap);
              scrollToBottom();
            }
            return;
          }
          var chunk = streamContentFromEvent(obj);
          if (!chunk) return;
          sawAssistant = true;
          acc += chunk;
          bodyEl.innerHTML = AC.parseMarkdown(acc);
          scrollToBottom();
        },
        onDone: function() {
          if (!sawAssistant || !acc.trim()) {
            streamWrap.remove();
          }
          loadHistory(aid, { softFail: true }).then(function(ok) {
            if (!ok && sawAssistant && acc) {
              /* history failed; keep streamed bubble */
            } else if (ok) {
              /* history replaced thread */
            } else if (!sawAssistant) {
              addMsg('assistant', '(no response)');
            }
          }).finally(function() {
            document.getElementById('send-btn').disabled = false;
          });
        },
        onError: function(err) {
          streamWrap.remove();
          errorEl.innerHTML = '<div class="af-alert af-alert-danger" role="alert">' + (err && err.message ? err.message : err) + '</div>';
          document.getElementById('send-btn').disabled = false;
        }
      }).catch(function(err) {
        streamWrap.remove();
        errorEl.innerHTML = '<div class="af-alert af-alert-danger" role="alert">' + err.message + '</div>';
        document.getElementById('send-btn').disabled = false;
      });
    };
  </script>
</body>
</html>
